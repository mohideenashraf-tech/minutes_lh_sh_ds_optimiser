# Triggers a Render deploy when main is pushed (requires repo secret).
# See docs/DEPLOY.md — add RENDER_DEPLOY_HOOK_URL from Render → Service → Settings → Deploy Hook.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set — skipping hook."
            echo "Set the secret from Render → Settings → Deploy Hook, OR use Manual Deploy in Render."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "Deploy hook accepted (build runs on Render)."
