# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: spillover-milkrun-optimizer
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: .
      - key: SPILLOVER_MAX_PAIR_API_CALLS
        value: "50"
      - key: ORS_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
    autoDeploy: true
